name: Deploy to Pages

# The app is a static single page — no server, nothing to run, nothing leaves the device.
# Publishing it is the only practical way to try it on a phone: iOS gates OPFS and
# `storage.persist()` behind a secure context, so a plain-HTTP LAN address from `npm run
# dev` works but silently falls back to weaker storage.
#
# This needs Pages enabled at Settings -> Pages -> Source: GitHub Actions, and Pages on a
# *private* repo needs a paid GitHub plan. If neither applies, `netlify.toml` in the repo
# root configures the same build on Netlify's free tier, which serves private repos.
on:
  push:
    # Feature branches deploy too, because the whole point is trying the thing on a
    # phone before deciding whether to keep it.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # No `enablement: true` here: the workflow token cannot create a Pages site
      # ("Resource not accessible by integration"), and asking it to turns the clear
      # "enable Pages on this repo" message into a confusing permissions one.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
